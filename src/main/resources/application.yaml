spring:
  application:
    name: MiMi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mimi_db}
    username: ${DB_USERNAME:mimi_user}
    password: ${DB_PASSWORD:mimi_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true